<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13291e"><title>Elgjakta: Bleiekrise</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1712;color:#f5f2df;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:540px;margin:auto;min-height:100dvh;padding:18px 16px 40px;background:radial-gradient(ellipse at 50% 18%,#35543a,#14271f 52%,#0a1712)}.tag{font-size:11px;letter-spacing:3px;color:#c6d7a2;text-align:center;font-weight:900}.stats{display:flex;justify-content:space-around;background:#07140e99;border:1px solid #66845c66;border-radius:14px;padding:12px 5px;margin:16px 0;font-size:12px}.stat{text-align:center}.stat strong{display:block;font-size:19px;color:#f5d67d}.scene{position:relative;overflow:hidden;border-radius:22px;border:2px solid #66845c;min-height:275px;background:linear-gradient(#617f75 0%,#d4a46c 46%,#243b2b 47%,#10251a 100%);display:flex;align-items:center;justify-content:center}.scene:before{content:'🌲　　 🌲　🌲　　 🌲';position:absolute;top:32%;font-size:52px;white-space:nowrap;opacity:.7}.moose{position:relative;font-size:125px;filter:drop-shadow(0 8px 12px #08100a);animation:enter .8s both;z-index:1}.scene .ground{position:absolute;bottom:10px;font-size:14px;color:#d4d8bd;background:#07140eb5;padding:6px 12px;border-radius:20px}.bubble{background:#fff8e8;color:#1b241d;border-radius:18px;padding:16px 18px;margin:17px 0;font-size:22px;font-weight:850;line-height:1.24;box-shadow:0 6px 0 #adba91}.narrative{line-height:1.5;color:#e2e5d7;min-height:50px}.options{display:grid;gap:10px;margin-top:18px}button{font:inherit;border:1px solid #a8bd8a;border-radius:13px;padding:15px 12px;background:#264d35;color:#fff8e8;text-align:left;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #0a1b12}button:active{transform:translateY(3px);box-shadow:none}button:hover{background:#376344}.primary{background:#e9b64f;color:#1e2318;border-color:#ffe39d;text-align:center}.primary:hover{background:#ffd075}.tiny{text-align:center;color:#aebca8;font-size:12px;margin-top:20px}.ending{padding:15px;background:#152e22;border:1px solid #819f75;border-radius:14px;margin-top:14px}.ending h2{margin:0 0 10px;color:#ffe39d}.hidden{display:none}@keyframes enter{from{transform:translateX(150px) rotate(12deg);opacity:0}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><div class="tag">🦌 ELGJAKTA 2026 · PAPPA EDITION</div><div class="stats"><div class="stat">☕ KAFFE<strong id="coffee">100%</strong></div><div class="stat">🍼 PAPPA<strong id="dad">0</strong></div><div class="stat">🫎 JAKTLYKKE<strong id="luck">50</strong></div></div><div class="scene"><div class="moose" id="animal">🌲</div><div class="ground" id="place">POST 7 · 05:43</div></div><div class="bubble" id="speech">Det er stille på post. Alt kan skje...</div><p class="narrative" id="story">Du har akkurat åpnet termosen. Plutselig knaker det voldsomt i buskene.</p><div class="options" id="options"></div><div id="result" class="ending hidden"></div><div class="tiny">100 % useriøs jaktopplevelse · Laget for en ekte jaktpappa ❤️</div></main><script>const $=id=>document.getElementById(id);let stage=0,coffee=100,dad=0,luck=50,first='';function stats(){ $('coffee').textContent=coffee+'%';$('dad').textContent=dad;$('luck').textContent=luck;}function set(animal,place,speech,story,choices){$('animal').textContent=animal;$('place').textContent=place;$('speech').textContent=speech;$('story').textContent=story;$('result').classList.add('hidden');$('options').innerHTML='';choices.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('options').appendChild(b)});stats()}function intro(){stage=0;coffee=100;dad=0;luck=50;set('🌲','POST 7 · 05:43','Det er stille på post. Alt kan skje...','Du har akkurat åpnet termosen. Plutselig knaker det voldsomt i buskene.',[['👀 Se mot buskene',moose]])}function moose(){set('🫎','POST 7 · EN UVENTET GJEST','HAR DU HUSKET BLEIENE?!','En diger elg stirrer rett på deg. Den virker mer bekymret for bleiesituasjonen enn for jakta.',[['✅ Ja, de ligger i sekken!',()=>answer('yes')],['🤔 Ehh... tror det?',()=>answer('maybe')],['😬 Nei, det glemte jeg!',()=>answer('no')],['🏃 LØP!',()=>answer('run')]])}function answer(a){first=a;let speech,story;if(a==='yes'){dad+=100;luck+=20;speech='ENDELIG EN ANSVARLIG PAPPA!';story='Elgen nikker stolt og byr på kaffe. «Du får fortsette jakta. Men først: en liten prøve.»'}else if(a==='maybe'){coffee-=20;dad+=10;speech='TROR DET?!';story='Elgen ringer hjem på høyttaler. Du hører et dypt sukk. «Vi må sjekke pappakompetansen din.»'}else if(a==='no'){luck-=20;speech='JAKTA ER MIDLERTIDIG AVLYST!';story='En hjort kommer ut av skogen med barnevogn. Elgen peker strengt mot nærmeste butikk.'}else{coffee-=30;luck-=10;speech='DU KAN IKKE LØPE FRA BLEIESKIFT!';story='Elgen tar deg igjen på tre sekunder. En hjort filmer det hele. «Dette går rett i jaktlagets gruppechat.»'}set('🫎','PAPPAKONTROLL · NIVÅ 1',speech,story,[['🎯 Ta pappaprøven',quiz1]])}function quiz1(){set('🦌','TEST 1 AV 3','Hva gjør du når babyen gråter klokka 03:14?','En hjort med refleksvest er eksamensvakt.',[['🍼 Sjekker bleie, mat og trøst',()=>quiz2(true)],['☕ Skrur på kaffetrakteren',()=>quiz2(false)],['📯 Prøver hjortelokk',()=>quiz2(false)]])}function quiz2(good){if(good)dad+=100;else coffee-=15;set('🫎','TEST 2 AV 3','Hvilken lyd er dette: «WÆÆÆÆ!»','Elgen holder opp en høyttaler. Du aner uro.',[['👶 Baby som vil ha mat',()=>quiz3(true)],['🦌 Hjort i brunst',()=>quiz3(false)],['📱 Jaktkameraten som har mistet mobilen',()=>quiz3(false)]])}function quiz3(good){if(good)dad+=100;else luck-=10;set('🍼','TEST 3 AV 3','Du har én ledig time. Hva gjør du?','Hele skogen holder pusten.',[['❤️ Familietid, så jakt når det passer',()=>finish(true)],['😴 En høyst nødvendig powernap',()=>finish(true)],['🫎 Spør elgen om barnevakt',()=>finish(false)]])}function finish(good){if(good)dad+=100;else dad+=50;luck=Math.max(0,luck);coffee=Math.max(0,coffee);set('🏆','OPPDRAG FULLFØRT','AUTORISERT ELGJEGER OG BLEIESKIFTOPERATØR!','Elgen holder en høytidelig seremoni. Hjorten spiller trompet. Jaktlaget har aldri vært stoltere.',[['🔁 Spill igjen',intro],['📋 Kopier diplomet',()=>{let t='🏆 AUTORISERT ELGJEGER OG BLEIESKIFTOPERATØR 🫎🍼\nPappapoeng: '+dad+' · Jaktlykke: '+luck+'\nGodkjent av Skogens Pappakommisjon.';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>alert('Diplomet er kopiert!')).catch(()=>prompt('Kopier diplomet:',t))}else prompt('Kopier diplomet:',t)}]]);$('result').innerHTML='<h2>🎉 DIPLOM UTSTEDT</h2>Skogens Pappakommisjon bekrefter at du kan håndtere både elg og bleier.<p><b>Pappapoeng:</b> '+dad+'<br><b>Jaktlykke:</b> '+luck+'</p>'; $('result').classList.remove('hidden');}intro();</script></body></html>
